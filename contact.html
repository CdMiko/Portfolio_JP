<!DOCTYPE html>
<html lang="zxx">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- color of address bar in mobile browser -->
    <meta name="theme-color" content="#2B2B35" />
    <!-- favicon  -->
    <link rel="shortcut icon" href="img/thumbnail.ico" type="image/x-icon" />
    <!-- bootstrap css -->
    <link rel="stylesheet" href="css/plugins/bootstrap.min.css" />
    <!-- font awesome css -->
    <link rel="stylesheet" href="css/plugins/font-awesome.min.css" />
    <!-- swiper css -->
    <link rel="stylesheet" href="css/plugins/swiper.min.css" />
    <!-- fancybox css -->
    <link rel="stylesheet" href="css/plugins/fancybox.min.css" />
    <!-- main css -->
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>


    <title>Jean Piere</title>
  </head>

  <body>
    <!-- app -->
    <div class="art-app">
      <!-- mobile top bar -->
      <div class="art-mobile-top-bar"></div>

      <!-- app wrapper -->
      <div class="art-app-wrapper">
        <!-- app container end -->
        <div class="art-app-container">
          <!-- info bar -->
          <div class="art-info-bar">
            <!-- menu bar frame -->
            <div class="art-info-bar-frame">
              <!-- info bar header -->
              <div class="art-header">
                <!-- avatar -->
                <div class="art-avatar">
                  <a
                    data-fancybox="avatar"
                    href="img/face-1.jpg"
                    class="art-avatar-curtain"
                  >
                    <img src="img/face-1.jpg" alt="avatar" />
                    <i class="fas fa-expand"></i>
                  </a>
                  <!-- available -->
                  <div class="art-lamp-light">
                    <!-- add class 'art-not-available' if not available-->
                    <div class="art-available-lamp"></div>
                  </div>
                </div>
                <!-- avatar end -->
                <!-- name -->
                <h5 class="art-name-principal" >
                  <a href="/index.html">Jean Piere</a>
                </h5>
                <!-- post -->
                <div class="art-sm-text">
                  Ingeniero de Performance <br />Fenix Power Plant
                </div>
              </div>

              <!-- scroll frame -->
              <div id="scrollbar2" class="art-scroll-frame">
                <!-- info bar about -->
                <div class="sidebar-menu">
                  <!-- about text -->
                  <ul>
                    <!-- country -->
                    <li class="fist-line-table">
                      <a href="/Portfolio_JP/index.html"><i class="fa fa-home"></i>Inicio</a>
                    </li>
                    <!-- city -->
                    <li class="fist-line-table">
                      <a href="/Portfolio_JP/history.html"><i class="fa fa-user"></i>Trayectoria</a>
                    </li>
                    <!-- age -->
                    <li class="fist-line-table">
                      <a href="/trayectoria.html"><i class="fa fa-user"></i>Conocimientos,<br />Habilidades</a>
                    </li>
                    <li class="fist-line-table">
                      <a href="/proyectos.html"><i class="fa fa-folder"></i>Proyectos</a>
                    </li>
                    <li class="fist-line-table">
                      <a href="/Portfolio_JP//blog.html"><i class="fa fa-pencil-alt"></i>Blog</a>
                    </li>
                    <li class="fist-line-table">
                      <a href="/Portfolio_JP/contact.html"><i class="fa fa-envelope"></i>Contacto</a>
                    </li>
                  </ul>
                </div>
                <!-- info bar about end -->

                <div class="art-links-frame p-15-15">
                  <!-- download cv button -->
                  <a href="CV_Jean Piere Cholán.pdf" class="art-link" download
                    >Descargar cv <i class="fas fa-download"></i
                  ></a>
                </div>
                <!-- links frame end -->
              </div>
              <!-- scroll frame end -->

              <!-- sidebar social -->
              <div class="art-ls-social">
                <!-- social link -->
                <a href="https://www.linkedin.com/in/jpcamoga/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                <!-- social link -->
                <a href="https://www.facebook.com/jeanpiere.cholanllamoga.7" target="_blank"><i class="fab fa-facebook"></i></a>
                <!-- social link -->
                <a href="https://www.instagram.com/_jeanm4/" target="_blank"><i class="fab fa-instagram"></i></a>
                <!-- social link -->
                <a href="#." target="_blank"><i class="fab fa-github"></i></a>
                
              </div>
              <!-- sidebar social end -->
            </div>
            <!-- menu bar frame end -->
          </div>
          <!-- info bar end -->

          <!-- content -->
          <div class="art-content">
            <!-- curtain -->
            <div class="art-curtain"></div>

            <!-- top background -->
            <div class="art-top-bg" style="background-image: url(img/bg.jpg)">
              <!-- overlay -->
              <div class="art-top-bg-overlay"></div>
              <!-- overlay end -->
            </div>
            <!-- top background end -->

            <!-- swup container -->
            <div class="transition-fade" id="swup">
              <!-- scroll frame -->
              <div id="scrollbar" class="art-scroll-frame">
                <!-- container -->
                <div class="container-fluid">
                  <!-- row -->
                  <div class="row p-30-0">
                    
                    <!-- col -->
                    <div class="col-lg-12">
                      <!-- section title -->
                      <div class="art-section-title">
                        <!-- title frame -->
                        <div class="art-title-frame">
                          <!-- title -->
                          <h4>Contáctame</h4>
                        </div>
                        <!-- title frame end -->
                      </div>
                      <!-- section title end -->

                      <!-- contact form frame -->
                      <div class="art-a art-card">
                        <!-- contact form -->
                        <form id="form" class="art-contact-form">
                          <!-- form field -->
                          <div class="art-form-field">
                            <!-- name input -->
                            <input
                              id="name"
                              name="name"
                              class="art-input"
                              type="text"
                              placeholder="Nombre"
                              required
                              autocomplete="name"
                            />
                            <!-- label -->
                            <label for="name"
                              ><i class="fas fa-user"></i
                            ></label>
                          </div>
                          <!-- form field end -->
                          <!-- form field -->
                          <div class="art-form-field">
                            <!-- email input -->
                            <input
                              id="email"
                              name="email"
                              class="art-input"
                              type="email"
                              placeholder="Email"
                              required
                              autocomplete="email"

                            />
                            <!-- label -->
                            <label for="email"><i class="fas fa-at"></i></label>
                          </div>
                          <!-- form field end -->
                          <!-- form field -->
                          <div class="art-form-field">
                            <!-- message textarea -->
                            <textarea
                              id="message"
                              name="message"
                              class="art-input"
                              placeholder="Mensaje"
                              required
                              autocomplete="off"
                            ></textarea>
                            <!-- label -->
                            <label for="message"
                              ><i class="far fa-envelope"></i
                            ></label>
                          </div>
                          <!-- form field end -->
                          <!-- button -->
                          <div class="art-submit-frame">
                            <button
                              class="art-btn art-btn-md art-submit"
                              type="submit"
                            >
                              <span>Enviar</span>
                            </button>
                            <!-- success -->
                            <div class="art-success">
                              Success <i class="fas fa-check"></i>
                            </div>
                          </div>
                        </form>
                        <!-- contact form end -->
                      </div>
                      <!-- contact form frame end -->
                    </div>
                    <!-- col end -->
                  </div>
                  <!-- row end -->
                </div>
                <!-- container end -->

                
                <div class="container-fluid">
                  <!-- footer -->
                  <footer class="pato10">
                    <!-- copyright -->
                    <div>© 2025 Jean Piere</div>
                  </footer>
                  <!-- footer end -->
                </div>
                <!-- footer end -->
              </div>
              <!-- scroll frame end -->
            </div>
            <!-- swup container end -->
          </div>
          <!-- content end -->

          <!-- menu bar -->
          
        </div>
        <!-- app container end -->
      </div>
      <!-- app wrapper end -->

      <!-- preloader -->
      <div class="art-preloader">
        <!-- preloader content -->
        <div class="art-preloader-content">
          <!-- title -->
          <h4>Jean Piere</h4>
          <!-- progressbar -->
          <div id="preloader" class="art-preloader-load"></div>
        </div>
        <!-- preloader content end -->
      </div>
      <!-- preloader end -->
    </div>

    <script src="js/plugins/jquery.min.js"></script>

    <script src="js/plugins/progressbar.min.js"></script>
    <!-- smooth scrollbar js -->
    <script src="js/plugins/smooth-scrollbar.min.js"></script>
    <!-- overscroll js -->
    <script src="js/plugins/overscroll.min.js"></script>
    <!-- typing js -->
    <script src="js/plugins/typing.min.js"></script>
    <!-- isotope js -->
    <script src="js/plugins/isotope.min.js"></script>
    <!-- fancybox js -->
    <script src="js/plugins/fancybox.min.js"></script>
    <!-- swup js -->
    <script src="js/plugins/swup.min.js"></script>

    <!-- main js -->
    <script src="js/main.js"></script>
